# Configuration for Model A: SKIPP'D Sky Image Solar PV Nowcasting
dataset_name: "skippd"
task: "nowcast"
description: "Contemporaneous PV power output estimation (kW) from single fish-eye sky image"
forecast_horizon_minutes: 0  # Contemporaneous nowcast (t -> t), not forward forecasting

paths:
  train_parquet: "data/raw/skippd/train-00000-of-00005.parquet"
  test_parquet: "data/raw/skippd/test-00000-of-00001.parquet"

target:
  name: "pv"
  unit: "kW"
  rated_capacity_kw: 30.0
  min_val: 0.0
  max_val: 30.0

split:
  policy: "calendar_day"
  train_ratio: 0.80
  val_ratio: 0.20
  chronological: true
  random_state: 42

transforms:
  image_size: [64, 64]
  normalize: true
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

dataloader:
  batch_size: 64
  num_workers: 0  # Windows-safe multiprocessing
  shuffle_train: true
  pin_memory: false
